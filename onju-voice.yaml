substitutions:
  name: "onju-voice"
  friendly_name: "Onju Voice"
  project_version: "1.1.0"
  device_description: "Onju Voice Satellite with ESPHome software and microWakeWord"
  wakeup_sound_url: "flash://onju-wakeup.mp3" # New Notification #7 by UNIVERSFIELD https://freesound.org/people/UNIVERSFIELD/sounds/736267/
  error_sound_url: "https://github.com/tetele/onju-voice-satellite/raw/main/res/error.mp3" # Error #8 by UNIVERSFIELD https://freesound.org/people/UNIVERSFIELD/sounds/734442/
  timer_finished_sound_url: "flash://onju-timer.mp3" # Local generated MP3; existing decoder

external_components:
  - source:
      type: local
      path: onju-voice-assets/tetele-production/components
    components: [adf_pipeline, i2s_audio, microphone, micro_wake_word, voice_assistant, esp32_touch, onju_timer]

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "${device_description}"
  name_add_mac_suffix: true
  project:
    name: tetele.onju_voice_satellite
    version: "${project_version}"
  min_version: 2024.7.3
  platformio_options:
    board_build.flash_mode: dio
    board_build.arduino.memory_type: qio_opi
  on_boot:
    then:
      - light.turn_on:
          id: top_led
          effect: slow_pulse
          red: 100%
          green: 60%
          blue: 0%
      - wait_until:
          condition:
            wifi.connected:
      - light.turn_on:
          id: top_led
          effect: pulse
          red: 0%
          green: 100%
          blue: 0%
      - wait_until:
          condition:
            api.connected:
      - light.turn_on:
          id: top_led
          effect: none
          red: 0%
          green: 100%
          blue: 0%
      - delay: 1s
      - script.execute: reset_led

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      # need to set a s3 compatible board for the adf-sdk to compile
      # board specific code is not used though
      CONFIG_ESP32_S3_BOX_BOARD: "y"

psram:
  mode: octal
  speed: 80MHz

# Enable logging
logger:
  baud_rate: 115200
  hardware_uart: USB_SERIAL_JTAG

# Allow OTA updates
ota:
  platform: esphome

# Allow provisioning Wi-Fi via serial
improv_serial:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
network:
  enable_ipv6: true

api:
  reboot_timeout: 0s
  services:
    - service: touch_diag_snapshot
      then:
        - lambda: id(onju_touch_diag_hub).dump_config();
    - service: start_va
      then:
        - voice_assistant.start
    - service: stop_va
      then:
        - voice_assistant.stop
    - service: notification_on
      then:
        - script.execute: turn_on_notification
    - service: notification_clear
      then:
        - script.execute: clear_notification

globals:
  - id: onju_handover_with_tone
    type: bool
    restore_value: false
    initial_value: "true"
  - id: thresh_percent
    type: float
    initial_value: "0.03"
    restore_value: false
  - id: notification
    type: bool
    restore_value: false
  - id: timer_center_consumed
    type: bool
    restore_value: false
    initial_value: "false"

interval:
  - interval: 1s
    then:
      - script.execute:
          id: calibrate_touch
          button: 0
      - script.execute:
          id: calibrate_touch
          button: 1
      - script.execute:
          id: calibrate_touch
          button: 2

i2s_audio:
  - id: i2s_shared
    i2s_lrclk_pin: GPIO13
    i2s_bclk_pin: GPIO18
    access_mode: duplex

adf_pipeline:
  - platform: i2s_audio
    type: audio_out
    id: adf_i2s_out
    i2s_audio_id: i2s_shared
    i2s_dout_pin: GPIO12
    sample_rate: 16000
    adf_alc: true
    alc_max: .5
    bits_per_sample: 32bit
    fixed_settings: true
    channel: left

  - platform: i2s_audio
    type: audio_in
    id: adf_i2s_in
    i2s_audio_id: i2s_shared
    i2s_din_pin: GPIO17
    channel: left
    pdm: false
    sample_rate: 16000
    bits_per_sample: 32bit
    fixed_settings: true

microphone:
  - platform: adf_pipeline
    id: onju_microphone
    keep_pipeline_alive: true
    gain_log2: 3
    pipeline:
      - adf_i2s_in
      - self

media_player:
  - platform: adf_pipeline
    id: onju_out
    name: None
    internal: false
    keep_pipeline_alive: true
    pipeline:
      - self
      - resampler
      - adf_i2s_out
    on_state:
      then:
        - lambda: |-
            if (id(onju_out).state == media_player::MEDIA_PLAYER_STATE_PLAYING) {
            }
            static float old_volume = -1;
            float new_volume = id(onju_out).volume;
            if(abs(new_volume-old_volume) > 0.0001) {
              if(old_volume != -1) {
                id(show_volume)->execute();
              }
            }
            old_volume = new_volume;

micro_wake_word:
  id: mww
  microphone:
    id: mww_probe_source
    microphone: onju_microphone
    gain_factor: 1
  models:
    - model: https://raw.githubusercontent.com/esphome/micro-wake-word-models/40ff33f57f8fc6ad71a75ef085abbf742495b225/models/v2/okay_nabu.json
      id: okay_nabu
    - model: https://raw.githubusercontent.com/esphome/micro-wake-word-models/40ff33f57f8fc6ad71a75ef085abbf742495b225/models/v2/hey_jarvis.json
      id: hey_jarvis
    - model: https://raw.githubusercontent.com/esphome/micro-wake-word-models/40ff33f57f8fc6ad71a75ef085abbf742495b225/models/v2/hey_mycroft.json
      id: hey_mycroft
  vad:
    model: https://raw.githubusercontent.com/esphome/micro-wake-word-models/40ff33f57f8fc6ad71a75ef085abbf742495b225/models/v2/vad.json
  on_wake_word_detected:
    - lambda: |-
        id(onju_handover_with_tone) = id(wakeword_confirmation_sound).state;
    - if:
        condition: media_player.is_playing
        then:
          - media_player.pause
    # Wait for the actual MWW task teardown AND physical microphone STOPPED.
    - wait_until:
        condition:
          lambda: return !id(mww).is_running() && id(onju_microphone).is_stopped();
        timeout: 10s
    - if:
        condition:
          lambda: return !id(mww).is_running() && id(onju_microphone).is_stopped() && !id(va).is_running() && id(use_wake_word).state && !id(mute_switch).state;
        then:
          - logger.log: "HANDOVER MWW stopped; physical microphone STOPPED; release confirmed"
          - if:
              condition:
                lambda: return id(onju_handover_with_tone);
              then:
                - logger.log: "HANDOVER release confirmed -> local tone and configured delay"
                - media_player.play_media: "${wakeup_sound_url}"
                - delay: !lambda return static_cast<uint32_t>(id(assist_start_delay_setting).state);
          - if:
              condition:
                lambda: return !id(va).is_running() && !id(mww).is_running() && id(onju_microphone).is_stopped() && id(use_wake_word).state && !id(mute_switch).state;
              then:
                - logger.log: "HANDOVER released; optional configured delay elapsed -> VA START"
                - voice_assistant.start:
                    wake_word: !lambda return wake_word;
              else:
                - logger.log:
                    level: ERROR
                    format: "HANDOVER ownership/permission changed; VA start aborted"
                - script.execute:
                    id: onju_wakeword_recover
                    reason: "handover_final_guard"
        else:
          - logger.log:
              level: ERROR
              format: "HANDOVER microphone release timeout or permission changed; VA start aborted"
          - script.execute:
              id: onju_wakeword_recover
              reason: "handover_release_timeout"

onju_timer:
  id: onju_timers
  voice_assistant: va
  media_player: onju_out
  light: top_led
  playback_allowed: !lambda return !id(onju_wakeword_recover).is_running();
  on_refresh:
    - script.execute: reset_led
  on_recover:
    - if:
        condition:
          lambda: return !id(va).is_running();
        then:
          - script.execute:
              id: onju_wakeword_recover
              reason: "timer_dismiss"

voice_assistant:
  id: va
  micro_wake_word: mww
  microphone: onju_microphone
  media_player: onju_out
  use_wake_word: false
  on_start:
    - lambda: id(onju_timers).voice_started();
  on_idle:
    - lambda: id(onju_timers).set_assist_phase(0);
    - script.execute: reset_led
  on_listening:
    - lambda: id(onju_timers).set_assist_phase(1);
    - light.turn_on:
        id: top_led
        blue: 100%
        red: 100%
        green: 100%
        brightness: 100%
        effect: listening
  on_stt_vad_end:
    - lambda: id(onju_timers).set_assist_phase(2);
    - light.turn_on:
        id: top_led
        blue: 100%
        red: 0%
        green: 20%
        brightness: 70%
        effect: processing
  on_tts_end:
    - lambda: id(onju_timers).set_assist_phase(3);
    - light.turn_on:
        id: top_led
        blue: 0%
        red: 20%
        green: 100%
        effect: speaking
  on_end:
    - wait_until:
        condition:
          not:
            media_player.is_playing: onju_out
        timeout: 30s
    - script.execute: reset_led
    - script.execute:
        id: onju_wakeword_recover
        reason: "va_end"
  on_timer_started:
    - lambda: id(onju_timers).timers_changed();
  on_timer_updated:
    - lambda: id(onju_timers).timers_changed();
  on_timer_cancelled:
    - lambda: id(onju_timers).cancelled(timer);
  on_timer_finished:
    - lambda: id(onju_timers).finished(timer);
  on_timer_tick:
    - lambda: id(onju_timers).timers_changed();
  on_client_connected:
    - if:
        condition:
          and:
            - switch.is_on: use_wake_word
            - binary_sensor.is_off: mute_switch
        then:
          - micro_wake_word.start:
  on_client_disconnected:
    - if:
        condition:
          and:
            - switch.is_on: use_wake_word
            - binary_sensor.is_off: mute_switch
        then:
          - voice_assistant.stop:
          - micro_wake_word.stop:
  on_error:
    - media_player.play_media: "${error_sound_url}"
    - light.turn_on:
        id: top_led
        blue: 0%
        red: 100%
        green: 0%
        effect: none
    - delay: 1s
    - script.execute: reset_led
    - script.execute:
        id: onju_wakeword_recover
        reason: "va_error"

number:
  - platform: template
    id: assist_start_delay_setting
    name: "Assist-Startverzögerung"
    icon: mdi:timer-sand
    entity_category: config
    unit_of_measurement: ms
    min_value: 0
    max_value: 1500
    step: 50
    optimistic: true
    restore_value: true
    initial_value: 1500

  - platform: template
    id: microphone_gain_setting
    name: "Mikrofon-Gain"
    icon: mdi:microphone-settings
    entity_category: config
    min_value: 0
    max_value: 5
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 3
    on_value:
      - lambda: |-
          id(onju_microphone).set_gain_log2(static_cast<uint8_t>(x));
          ESP_LOGI("onju.settings", "Microphone gain_log2=%u; existing post-DC gain", unsigned(x));

  - platform: template
    name: "Touch threshold percentage"
    id: touch_threshold_percentage
    update_interval: never
    entity_category: config
    initial_value: 0.75
    min_value: 0.25
    max_value: 5
    step: 0.05
    optimistic: true
    on_value:
      then:
        - lambda: !lambda |-
            id(thresh_percent) = 0.01 * x;

esp32_touch:
  id: onju_touch_diag_hub
  setup_mode: false
  sleep_duration: 2ms
  measurement_duration: 250us
  low_voltage_reference: 0.8V
  high_voltage_reference: 2.4V

  filter_mode: IIR_16
  debounce_count: 2
  noise_threshold: 3
  jitter_step: 4
  smooth_mode: IIR_4

  denoise_grade: BIT8
  denoise_cap_level: L0

binary_sensor:
  - platform: esp32_touch
    id: volume_down
    pin: GPIO4
    threshold: 1000
    on_press:
      then:
        - light.turn_on: left_led
        - script.execute:
            id: set_volume
            volume: -0.05
        - delay: 750ms
        - while:
            condition:
              binary_sensor.is_on: volume_down
            then:
              - script.execute:
                  id: set_volume
                  volume: -0.05
              - delay: 150ms
    on_release:
      then:
        - light.turn_off: left_led

  - platform: esp32_touch
    id: volume_up
    pin: GPIO2
    threshold: 1000
    on_press:
      then:
        - light.turn_on: right_led
        - script.execute:
            id: set_volume
            volume: 0.05
        - delay: 750ms
        - while:
            condition:
              binary_sensor.is_on: volume_up
            then:
              - script.execute:
                  id: set_volume
                  volume: 0.05
              - delay: 150ms
    on_release:
      then:
        - light.turn_off: right_led

  - platform: esp32_touch
    id: action
    pin: GPIO3
    threshold: 1000
    on_press:
      - lambda: |-
          id(timer_center_consumed) = id(onju_timers).alarm_active();
          if (id(timer_center_consumed)) id(onju_timers).dismiss();
    on_click:
      - if:
          condition:
            lambda: return id(timer_center_consumed) || id(onju_timers).alarm_active();
          then:
            - lambda: id(onju_timers).dismiss();
          else:
            - if:
                condition:
                  or:
                    - switch.is_off: use_wake_word
                    - binary_sensor.is_on: mute_switch
                then:
                  - logger.log:
                      tag: "action_click"
                      format: "Voice assistant is running: %s"
                      args: ['id(va).is_running() ? "yes" : "no"']
                  - if:
                      condition: media_player.is_playing
                      then:
                        - logger.log: "LC binary_sensor/on_click/ -> media_player.stop"
                        - media_player.stop
                  - if:
                      condition: voice_assistant.is_running
                      then:
                        - logger.log: "LC binary_sensor/on_click/ -> voice_assistant.stop:"
                        - voice_assistant.stop:
                      else:
                        - logger.log: "LC binary_sensor/on_click/ -> voice_assistant.start:"
                        - voice_assistant.start:
                else:
                  - logger.log:
                      tag: "action_click"
                      format: "Voice assistant was running with wake word detection enabled. Starting continuously"
                  - if:
                      condition: media_player.is_playing
                      then:
                        - logger.log: "LC binary_sensor/on_click/ -> media_player.stop"
                        - media_player.stop
                  - logger.log: "LC binary_sensor/on_click/ -> voice_assistant.stop"
                  - voice_assistant.stop
                  - delay: 1s
                  - script.execute: reset_led
                  - script.wait: reset_led
                  - logger.log: "LC binary_sensor/on_click/ -> voice_assistant.start_continuous:"
                  - voice_assistant.start_continuous:

  - platform: gpio
    id: mute_switch
    internal: true
    pin:
      number: GPIO38
      mode: INPUT_PULLUP
    name: Disable wake word
    on_press:
      - script.execute: turn_off_wake_word
    on_release:
      - script.execute: turn_on_wake_word

light:
  - platform: esp32_rmt_led_strip
    id: leds
    pin: GPIO11
    chipset: SK6812
    num_leds: 6
    rgb_order: grb

    # ESP-IDF 5 allocates the RMT channel automatically.
    default_transition_length: 0s
    gamma_correct: 2.8
  - platform: partition
    id: left_led
    segments:
      - id: leds
        from: 0
        to: 0
    default_transition_length: 100ms
  - platform: partition
    id: top_led
    segments:
      - id: leds
        from: 1
        to: 4
    default_transition_length: 100ms
    effects:
      # Idskov proportional-bar principle; active native timers only.
      - addressable_lambda:
          name: timer_countdown
          update_interval: 200ms
          lambda: |-
            const float value = id(onju_timers).countdown_fraction() * it.size();
            for (int i = 0; i < it.size(); i++) {
              const float part = clamp(value - i, 0.0f, 1.0f);
              it[i] = Color(uint8_t(255 * part), uint8_t(140 * part), 0);
            }
      - addressable_lambda:
          name: timer_alarm
          update_interval: 100ms
          lambda: |-
            const bool bright = (millis() / 300) % 2 == 0;
            it.all() = Color(bright ? 255 : 16, 0, 0);
      - pulse:
          name: pulse
          transition_length: 250ms
          update_interval: 250ms
      - pulse:
          name: slow_pulse
          transition_length: 1s
          update_interval: 2s
      - addressable_lambda:
          name: show_volume
          update_interval: 50ms
          lambda: |-
            int int_volume = int(id(onju_out).volume * 100.0f * it.size());
            int full_leds = int_volume / 100;
            int last_brightness = int_volume % 100;
            int i = 0;
            for(; i < full_leds; i++) {
              it[i] = Color::WHITE;
            }
            if(i < 4) {
              it[i++] = Color(64, 64, 64).fade_to_white(last_brightness*256/100);
            }
            for(; i < it.size(); i++) {
              it[i] = Color(64, 64, 64);
            }
      - addressable_twinkle:
          name: listening_ww
          twinkle_probability: 1%
      - addressable_twinkle:
          name: listening
          twinkle_probability: 45%
      - addressable_scan:
          name: processing
          move_interval: 80ms
      - addressable_flicker:
          name: speaking
          intensity: 35%
      - addressable_random_twinkle:
          name: random_twinkle
          twinkle_probability: 45%
  - platform: partition
    id: right_led
    segments:
      - id: leds
        from: 5
        to: 5
    default_transition_length: 100ms

script:
  # One bounded handover/END/ERROR cleanup; never starts a second VA.
  - id: onju_wakeword_recover
    mode: single
    parameters:
      reason: string
    then:
      - logger.log:
          format: "RECOVERY begin reason=%s"
          args: ["reason.c_str()"]
      - if:
          condition:
            lambda: return id(mww).is_running() && id(onju_microphone).is_running() && !id(va).is_running() && (id(onju_out).state != media_player::MEDIA_PLAYER_STATE_PLAYING);
          then:
            - logger.log: "RECOVERY MWW already running; no duplicate start"
          else:
            - wait_until:
                condition:
                  not:
                    media_player.is_playing: onju_out
                timeout: 10s
            - if:
                condition: media_player.is_playing
                then:
                  - logger.log:
                      level: ERROR
                      format: "RECOVERY playback timeout; stopping incomplete playback"
                  - media_player.stop: onju_out
            - voice_assistant.stop:
            - wait_until:
                condition:
                  not:
                    voice_assistant.is_running:
                timeout: 5s
            - if:
                condition:
                  not:
                    voice_assistant.is_running:
                then:
                  - micro_wake_word.stop:
                  - wait_until:
                      condition:
                        not:
                          micro_wake_word.is_running:
                      timeout: 5s
                  - if:
                      condition:
                        lambda: return !id(mww).is_running() && !id(onju_microphone).is_stopped();
                      then:
                        - lambda: |-
                            ESP_LOGW("onju.handover", "RECOVERY stale microphone after consumers stopped; stopping");
                            id(onju_microphone).stop();
                  - wait_until:
                      condition:
                        lambda: return id(onju_microphone).is_stopped();
                      timeout: 5s
                  - if:
                      condition:
                        lambda: return !id(va).is_running() && !id(mww).is_running() && id(onju_microphone).is_stopped() && (id(onju_out).state != media_player::MEDIA_PLAYER_STATE_PLAYING) && id(use_wake_word).state && !id(mute_switch).state;
                      then:
                        - logger.log: "RECOVERY consumers released -> MWW START"
                        - micro_wake_word.start:
                      else:
                        - logger.log:
                            level: ERROR
                            format: "RECOVERY not safe/allowed to restart MWW; no forced restart"
                else:
                  - logger.log:
                      level: ERROR
                      format: "RECOVERY VA stop timeout; no competing microphone start"

  - id: reset_led
    then:
      - if:
          condition:
            lambda: return !id(onju_timers).apply_led_priority(id(notification));
          then:
            - if:
                condition:
                  - lambda: return id(notification);
                then:
                  - light.turn_on:
                      id: top_led
                      blue: 100%
                      red: 100%
                      green: 0%
                      brightness: 100%
                      effect: slow_pulse
                else:
                  - if:
                      condition:
                        and:
                          - switch.is_on: use_wake_word
                          - switch.is_on: flicker_wake_word
                          - binary_sensor.is_off: mute_switch
                      then:
                        - light.turn_on:
                            id: top_led
                            blue: 100%
                            red: 100%
                            green: 0%
                            brightness: 60%
                            effect: listening_ww
                      else:
                        - light.turn_off: top_led

  - id: turn_on_notification
    then:
      - lambda: id(notification) = true;
      - script.execute: reset_led

  - id: clear_notification
    then:
      - lambda: id(notification) = false;
      - script.execute: reset_led

  - id: set_volume
    mode: restart
    parameters:
      volume: float
    then:
      - media_player.volume_set:
          id: onju_out
          volume: !lambda return clamp(id(onju_out).volume+volume, 0.0f, 1.0f);

  - id: show_volume
    mode: restart
    then:
      - lambda: id(onju_timers).set_volume_feedback(true);
      - light.turn_on:
          id: top_led
          effect: show_volume
      - delay: 1s
      - lambda: id(onju_timers).set_volume_feedback(false);
      - script.execute: reset_led

  - id: turn_on_wake_word
    then:
      - if:
          condition:
            and:
              - binary_sensor.is_off: mute_switch
              - switch.is_on: use_wake_word
          then:
            - micro_wake_word.start
            - script.execute: reset_led
          else:
            - logger.log:
                tag: "turn_on_wake_word"
                format: "Trying to start listening for wake word, but %s"
                args:
                  [
                    'id(mute_switch).state ? "mute switch is on" : "use wake word toggle is off"',
                  ]
                level: "INFO"

  - id: turn_off_wake_word
    then:
      - micro_wake_word.stop
      - script.execute: reset_led

  - id: calibrate_touch
    parameters:
      button: int
    then:
      - lambda: |-
          // Direct S3 hardware reads and delta programming, adapted from rmeissn.
          switch (button) {
            case 0: id(volume_down).calibrate_dynamic(id(thresh_percent)); break;
            case 1: id(action).calibrate_dynamic(id(thresh_percent)); break;
            case 2: id(volume_up).calibrate_dynamic(id(thresh_percent)); break;
          }

switch:
  - platform: template
    id: timer_led
    name: "Timer LED"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - lambda: id(onju_timers).set_display_enabled(true);
      - script.execute: reset_led
    on_turn_off:
      - lambda: id(onju_timers).set_display_enabled(false);
      - script.execute: reset_led

  - platform: template
    id: wakeword_confirmation_sound
    name: "Wakeword-Bestätigungston"
    icon: mdi:music-note
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: Use Wake Word
    id: use_wake_word
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: turn_on_wake_word
    on_turn_off:
      - script.execute: turn_off_wake_word
  - platform: template
    name: Wake Word Listening Light
    id: flicker_wake_word
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: reset_led
    on_turn_off:
      - script.execute: reset_led
  - platform: gpio
    id: dac_mute
    restore_mode: ALWAYS_OFF
    pin:
      number: GPIO21
      inverted: True

# Native HA Assist-Satellite owns model activation; sensitivity only.
select:
  - platform: template
    id: tetele_wake_word_sensitivity
    name: "Wake word sensitivity"
    optimistic: true
    # The productive firmware has four options; do not restore its numeric index
    # into this three-option A/B test. Start consistently at Moderate on boot.
    restore_value: false
    initial_option: Moderately sensitive
    entity_category: config
    options:
      - Slightly sensitive
      - Moderately sensitive
      - Very sensitive
    on_value:
      lambda: |-
        // Official Okay Nabu v2 is NOT 20241226.3. Only its manifest default
        // (0.97 -> uint8 247) is established here; no invented three-level table.
        id(okay_nabu).set_probability_cutoff(247);
        if (x == "Slightly sensitive") {
          id(hey_jarvis).set_probability_cutoff(247);
          id(hey_mycroft).set_probability_cutoff(253);
        } else if (x == "Moderately sensitive") {
          id(hey_jarvis).set_probability_cutoff(235);
          id(hey_mycroft).set_probability_cutoff(242);
        } else if (x == "Very sensitive") {
          id(hey_jarvis).set_probability_cutoff(212);
          id(hey_mycroft).set_probability_cutoff(237);
        }
